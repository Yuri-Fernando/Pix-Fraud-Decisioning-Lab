[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "pix-fraud-decisioning-lab"
version = "0.1.0"
description = "Laboratório educacional de decisão antifraude em transações Pix/TED sintéticas: regras versionadas, grafo, ML e simulador de ciclo MED."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24",
    "pandas>=2.0",
    "networkx>=3.1",
    "scikit-learn>=1.3",
    "scipy>=1.10",
    "PyYAML>=6.0",
    "matplotlib>=3.7",
]

[project.optional-dependencies]
llm = ["anthropic>=0.40"]
spark = ["pyspark>=3.5", "delta-spark>=3.1"]
dev = ["pytest>=8"]

[project.scripts]
pixfraud = "pixfraud.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
pixfraud = ["rules/*.yaml"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-q -p no:cacheprovider"
