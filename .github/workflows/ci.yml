name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.10", "3.12"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - name: Instalar dependências
        run: python -m pip install numpy pandas networkx scikit-learn scipy PyYAML matplotlib pytest
      - name: Testes (sem rede, sem chave de LLM, sem Spark)
        env:
          PYTHONPATH: src
        run: python -m pytest
